name: AyuGram build

# AyuGram: manual runs only. macOS minutes on a private repo are expensive.
on:
  workflow_dispatch:

concurrency:
  group: ayugram-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Set active Xcode path
        run: |
          XCODE_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["xcode"])')
          sudo xcode-select -s /Applications/Xcode_$XCODE_VERSION.app/Contents/Developer
          xcodebuild -version

      - name: Restore Bazel cache
        uses: actions/cache/restore@v4
        with:
          path: /Users/Shared/bazel-cache
          key: bazel-${{ hashFiles('versions.json') }}-${{ github.sha }}
          restore-keys: |
            bazel-${{ hashFiles('versions.json') }}-

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          cp -R $GITHUB_WORKSPACE /Users/Shared/
          mv /Users/Shared/$(basename $GITHUB_WORKSPACE) /Users/Shared/telegram-ios
          mkdir -p /Users/Shared/bazel-cache

      - name: Build the App
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          set -e
          SOURCE_DIR=/Users/Shared/telegram-ios
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"
          cd $SOURCE_DIR

          # Build configuration with our own API credentials (never committed).
          python3 - <<'PY'
          import json, os
          p = "build-system/appstore-configuration.json"
          c = json.load(open(p))
          c["api_id"] = os.environ["TELEGRAM_API_ID"]
          c["api_hash"] = os.environ["TELEGRAM_API_HASH"]
          json.dump(c, open("build-system/ayugram-configuration.json", "w"), indent=1)
          PY

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"
          COMMIT_COUNT=$(git rev-list --count HEAD)
          BUILD_NUMBER="$(($COMMIT_COUNT+$BUILD_NUMBER_OFFSET))"

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --cacheDir=/Users/Shared/bazel-cache \
            build \
            --configurationPath="build-system/ayugram-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          mkdir -p build/artifacts
          cp -L bazel-bin/Telegram/Telegram.ipa build/artifacts/Telegram-original.ipa
          ls -l build/artifacts

      - name: Save Bazel cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /Users/Shared/bazel-cache
          key: bazel-${{ hashFiles('versions.json') }}-${{ github.sha }}

      - name: Upload original IPA
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-original
          path: /Users/Shared/telegram-ios/build/artifacts/Telegram-original.ipa
          retention-days: 7

      - name: Re-identify for TrollStore
        run: |
          cd /Users/Shared/telegram-ios
          bash ayugram-build/reid.sh build/artifacts/Telegram-original.ipa build/artifacts/AyuGram.ipa com.feendly.ayugram AyuGram

      - name: Upload AyuGram IPA
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram
          path: /Users/Shared/telegram-ios/build/artifacts/AyuGram.ipa
          retention-days: 7
